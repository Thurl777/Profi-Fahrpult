name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verfügbare Schemes anzeigen
        run: xcodebuild -list -project ProfiFahrpult.xcodeproj

      - name: Unsigniert für iOS-Gerät bauen
        run: |
          xcodebuild \
            -project ProfiFahrpult.xcodeproj \
            -scheme ProfiFahrpult \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: IPA packen
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/ProfiFahrpult.app"
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          zip -r -y ../ProfiFahrpult.ipa Payload

      - name: IPA prüfen
        run: |
          set -e
          unzip -tq ProfiFahrpult.ipa
          # Ab iOS 12.2 gehört die Swift-Laufzeit zum System und darf nicht mit in der App liegen
          if unzip -l ProfiFahrpult.ipa | grep -q 'Frameworks/libswift'; then
            echo "::warning::Swift-Laufzeit ist in die App eingebettet (Mindestversion prüfen)"
          fi
          ls -l ProfiFahrpult.ipa
          shasum -a 256 ProfiFahrpult.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ProfiFahrpult-ipa
          path: ProfiFahrpult.ipa

      - name: Unit-Tests (Protokoll und Rechenlogik)
        # nach dem Upload, damit die IPA auch bei einem roten Test bereitsteht
        run: swift test
